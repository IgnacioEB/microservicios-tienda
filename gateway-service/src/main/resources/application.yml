server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: usuario-service
              uri: http://usuario-service:8080
              predicates:
                - Path=/api/usuario/**,/api/usuarios/**
              filters:
                - StripPrefix=1

            - id: producto-service
              uri: http://producto-service:8080
              predicates:
                - Path=/api/producto/**,/api/productos/**
              filters:
                - StripPrefix=1

            - id: pedido-service
              uri: http://pedido-service:8080
              predicates:
                - Path=/api/pedido/**,/api/pedidos/**
              filters:
                - StripPrefix=1